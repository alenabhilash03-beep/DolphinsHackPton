# Railway: deploy the root Dockerfile; the web health route also checks the API behind it.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Overrides any start command left in the dashboard (for example "npm start" from auto-detection).
startCommand = "bash scripts/start_container.sh"
healthcheckPath = "/api/backend-health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
