[project]
name = "hypothesim"
version = "0.1.0"
description = "Evidence-aware scientific hypothesis exploration"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn>=0.34,<1",
  "langchain>=1,<2",
  "langchain-nvidia-ai-endpoints>=1,<2",
  "langsmith>=0.4,<1",
  "numpy>=2,<3",
  "scipy>=1.15,<2",
  "fpdf2>=2.8,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["apps/api"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api"]
addopts = "-q"
